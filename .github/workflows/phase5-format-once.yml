name: One-time phase 5 formatting
on:
  push:
    paths: [".github/workflows/phase5-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          bunx prettier --write docs/ai-phase4-architecture.md docs/ai-phase5-meeting.md server/README.md src/components/meeting/MeetingMode.tsx
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ai-phase4-architecture.md docs/ai-phase5-meeting.md server/README.md src/components/meeting/MeetingMode.tsx src-tauri/src/
            git commit -m "style: قالب‌بندی فاز پنجم مطابق Prettier و Rustfmt"
            git push origin HEAD:main
          fi
