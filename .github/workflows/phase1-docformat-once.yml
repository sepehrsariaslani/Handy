name: One-off phase 1 architecture doc format
on:
  push:
    paths:
      - ".github/workflows/phase1-docformat-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format architecture documentation with project Prettier
        run: bunx prettier --write docs/ai-phase1-architecture.md
      - name: Commit formatting to main
        run: |
          if ! git diff --quiet -- docs/ai-phase1-architecture.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ai-phase1-architecture.md
            git commit -m "style: همسان‌سازی مستندات معماری با Prettier"
            git push origin HEAD:main
          fi
