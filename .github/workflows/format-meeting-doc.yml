name: Format meeting documentation
on:
  push:
    branches: ["feat/meeting-notes-parity-auto-tasks"]
    paths:
      - ".github/workflows/format-meeting-doc.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x prettier --write docs/ai-phase5-meeting.md
      - run: |
          git config user.name 'handy-feature-ci'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ai-phase5-meeting.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format meeting documentation'
            git push origin HEAD:feat/meeting-notes-parity-auto-tasks
          fi
