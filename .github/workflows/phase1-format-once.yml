# One-time maintenance workflow. Remove after the style fix is committed.
name: Phase 1 formatting cleanup
on:
  push:
    paths:
      - ".github/workflows/phase1-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format phase-1 files and an existing sidebar formatting debt
        run: |
          bunx prettier --write             src/components/meeting/MeetingMode.tsx             src/components/Sidebar.tsx             src/lib/ai/client.ts             src/lib/ai/contracts.ts             src/lib/ai/serverConfig.ts             src/lib/ai/serverConfig.test.ts             docs/benchmarks/phase1-baseline.md
      - name: Commit formatted files to main
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/meeting/MeetingMode.tsx src/components/Sidebar.tsx src/lib/ai docs/benchmarks/phase1-baseline.md
            git commit -m "style: قالب‌بندی فایل‌های فاز نخست"
            git push origin HEAD:main
          fi
