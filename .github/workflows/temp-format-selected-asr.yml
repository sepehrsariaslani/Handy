name: Temporary main selected-ASR formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-selected-asr.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format Meeting and Notes UI
        run: bunx prettier --write src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx server/README.md
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Push formatting directly to main
        run: |
          git config user.name 'handy-format-ci'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx src-tauri/src/commands/meeting.rs server/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format selected-model meeting and note integration'
            git push origin HEAD:main
          fi
