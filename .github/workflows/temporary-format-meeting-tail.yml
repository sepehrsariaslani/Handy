name: Temporary format full Meeting transcript
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-meeting-tail.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format updated Meeting UI and docs
        run: bunx prettier --write src/components/meeting/MeetingMode.tsx
      - name: Commit formatting directly to main
        run: |
          git config user.name 'handy-format-ci'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/components/meeting/MeetingMode.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style: format full Meeting transcript autoload'
            git push origin HEAD:main
          fi
