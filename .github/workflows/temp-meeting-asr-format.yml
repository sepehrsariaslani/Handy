name: Temporary meeting ASR formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-meeting-asr-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format edited TypeScript components
        run: bunx prettier --write src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx
      - name: Format native Rust recorder
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit directly to main without a branch
        run: |
          git config user.name 'handy-format-ci'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx src-tauri/src/commands/meeting.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: format meeting language and diagnostic improvements'
            git push origin HEAD:main
          fi
