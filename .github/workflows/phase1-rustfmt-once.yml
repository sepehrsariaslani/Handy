name: Phase 1 Rust formatting cleanup
on:
  push:
    paths:
      - ".github/workflows/phase1-rustfmt-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Rust formatter
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting to main
        run: |
          if ! git diff --quiet -- src-tauri/src/commands/meeting.rs src-tauri/src/managers/audio.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/commands/meeting.rs src-tauri/src/managers/audio.rs
            git commit -m "style: استانداردسازی قالب کد ضبط جلسه"
            git push origin HEAD:main
          fi
