name: One-time phase 7 formatting
on:
  push:
    paths: [".github/workflows/phase7-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write docs/ai-phase7-memory.md src/components/memory/MemoryMode.tsx src/lib/ai/client.ts src/lib/ai/contracts.ts server/README.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ai-phase7-memory.md src/components/memory/MemoryMode.tsx src/lib/ai/client.ts src/lib/ai/contracts.ts server/README.md
            git commit -m "style: قالب‌بندی فاز هفت مطابق Prettier"
            git push origin HEAD:main
          fi
