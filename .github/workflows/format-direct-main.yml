name: Format direct main edits
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-direct-main.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format React and TypeScript
        run: bunx prettier --write src/components/notes/NotesMode.tsx src/components/meeting/MeetingMode.tsx src/lib/ai/client.ts
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting directly to main
        run: |
          git config user.name 'handy-format-ci'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/components/notes/NotesMode.tsx src/components/meeting/MeetingMode.tsx src/lib/ai/client.ts src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m 'style: format post-stop transcription and logging changes'
            git push origin HEAD:main
          fi
      - name: Delete previously merged feature branch
        run: git push origin --delete feat/meeting-notes-parity-auto-tasks
