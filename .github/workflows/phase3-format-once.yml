name: Phase 3 formatting cleanup
on:
  push:
    paths:
      - ".github/workflows/phase3-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format frontend source
        run: |
          bunx prettier --write             src/components/live/LiveMode.tsx             src/lib/ai/liveSession.ts             src/lib/ai/liveAudio.ts             src/lib/ai/client.ts
      - name: Commit to main
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/live/LiveMode.tsx src/lib/ai/liveSession.ts src/lib/ai/liveAudio.ts src/lib/ai/client.ts
            git commit -m "style: همسان‌سازی فایل‌های فاز سوم با Prettier"
            git push origin HEAD:main
          fi
