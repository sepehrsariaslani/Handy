name: One-time Handy UI format preview
on:
  push:
    paths:
      - .github/workflows/handy-format-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Show exact Prettier changes
        run: |
          bunx prettier --write src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx
          git diff -- src/components/meeting/MeetingMode.tsx src/components/notes/NotesMode.tsx
