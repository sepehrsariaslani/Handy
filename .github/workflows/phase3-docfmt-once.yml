name: Phase 3 README formatting cleanup
on:
  push:
    paths:
      - ".github/workflows/phase3-docfmt-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write server/README.md
      - name: Commit to main
        run: |
          if ! git diff --quiet -- server/README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/README.md
            git commit -m "style: هماهنگی مستندات استریم با Prettier"
            git push origin HEAD:main
          fi
