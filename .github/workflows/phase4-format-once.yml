name: One-time phase 4 code formatting
on:
  push:
    paths: [".github/workflows/phase4-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          bunx prettier --write src/components/live/GlobalDictationSettings.tsx src/components/live/LiveMode.tsx
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/live/GlobalDictationSettings.tsx src/components/live/LiveMode.tsx src-tauri/src/
            git commit -m "style: همگام‌سازی قالب‌بندی فاز چهارم"
            git push origin HEAD:main
          fi
