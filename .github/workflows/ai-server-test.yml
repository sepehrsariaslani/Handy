name: AI server and streaming regression

on:
  push:
    paths:
      - "server/**"
      - "src/lib/ai/**"
      - "src/components/live/**"
      - "src/components/meeting/**"
      - "src/components/Sidebar.tsx"
      - ".github/workflows/ai-server-test.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/lib/ai/**"
      - "src/components/live/**"
      - "src/components/meeting/**"
      - "src/components/Sidebar.tsx"
      - ".github/workflows/ai-server-test.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e './server[dev]'
      - name: API regression tests
        working-directory: server
        run: python -m pytest -q
      - name: Measure local API overhead
        working-directory: server
        run: |
          set -o pipefail
          python benchmarks/measure_api.py | tee api-baseline.json
      - name: Upload reproducible benchmark
        uses: actions/upload-artifact@v4
        with:
          name: phase1-api-baseline
          path: server/api-baseline.json

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun src/lib/ai/serverConfig.test.ts
      - run: bun run build
