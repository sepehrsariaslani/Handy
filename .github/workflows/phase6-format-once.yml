name: One-time phase 6 formatting
on:
  push:
    paths: [".github/workflows/phase6-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write src/components/notes/NotesMode.tsx src/components/meeting/MeetingMode.tsx src/lib/ai/client.ts src/lib/ai/contracts.ts docs/ai-phase6-notes.md server/README.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/notes/NotesMode.tsx src/components/meeting/MeetingMode.tsx src/lib/ai/client.ts src/lib/ai/contracts.ts docs/ai-phase6-notes.md server/README.md
            git commit -m "style: قالب‌بندی فایل‌های فاز شش"
            git push origin HEAD:main
          fi
