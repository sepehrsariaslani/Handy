[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handy-ai-server"
version = "0.8.0"
description = "Self-hosted Whisper Large V3 and Qwen3.5-9B speech/text API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
diarization = ["pyannote.audio>=4,<5"]
semantic = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["handy_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
